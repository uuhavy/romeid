# Generated via `rome preset foundry hadrian` + Solidity ^0.8.28 settings
[profile.default]
src = "src"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

[rpc_endpoints]
rome-hadrian = "${HADRIAN_RPC_URL}"

